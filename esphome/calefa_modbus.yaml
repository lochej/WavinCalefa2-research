
# Seeed XIAO ESP32-C6 hardware config: Wi-Fi 6 (2.4GHz) support, status LED, external antenna
# control (FM8625H RF switch), and Wi-Fi/system diagnostics.
# Device identity, credentials, and OTA (esphome name/friendly_name, esp32 variant, api key,
# ota, wifi ssid/password/ap) come from the ESPHome Device Builder-generated device YAML.
# BLE tracking/proxy (esp32_ble_tracker, bluetooth_proxy) is intentionally excluded — see the
# "proxy" variant for that.

# Wavin Calefa II (DHW 212 V ITC) – ESPHome Modbus package
#
# Include from the device config (file next to it in the ESPHome config dir):
#   packages:
#     calefa: !include calefa_modbus.yaml
#
# Wiring (Xiao ESP32C6 -> 3.3 V RS-485 transceiver):
#   GPIO0 -> DI (TX), GPIO2 <- RO (RX), GPIO1 -> DE+RE
#
# Addresses are raw 0-based PDU addresses (same as REGISTER_MAP.md).
# The Calefa rejects any read that touches an invalid address, so neighbouring
# registers are only grouped inside valid ranges. `register_count` is used to
# bridge small gaps so ESPHome reads each group in a single request.


esp32:
    # Explicit board ID (not just variant) for correct board-specific defaults and pin aliases
    # (RF_SWITCH_EN / RF_ANT_SELECT).
    board: seeed_xiao_esp32c6
    framework:
        type: esp-idf
        sdkconfig_options:
            # C6-specific: Wi-Fi 6 (802.11ax), 2.4GHz only (no 5GHz radio on this chip)
            CONFIG_SOC_WIFI_HE_SUPPORT: "y"
            CONFIG_ESP_WIFI_11AX_SUPPORT: "y"

esphome:
    name: wavin-calefa
    includes:
        - <esp_wifi.h>
    on_boot:
        - priority: -10
          then:
              # Enable external antenna by default (FM8625H RF switch)
              - output.turn_off: rf_switch_enable    # LOW -> RF switch power ON
              - output.turn_on: rf_antenna_select    # HIGH -> external antenna (U.FL)
    project:
      name: esphome.web
      version: '1.0'
      
logger:
    level: DEBUG
    baud_rate: 115200
    hardware_uart: USB_SERIAL_JTAG

api:
    reboot_timeout: 15min

# Allow Over-The-Air updates
ota:
- platform: esphome

improv_serial:

web_server:
      
wifi:
    domain: .local
    power_save_mode: NONE
    fast_connect: true
    enable_on_boot: true
    reboot_timeout: 10min
    enable_btm: true  # 802.11v BSS Transition Management (AP-coordinated roaming)
    enable_rrm: true  # 802.11k Radio Resource Management (neighbor-assisted scanning)
    ssid: !secret wifi_ssid
    password: !secret wifi_password
    ap:
        ap_timeout: 120s
    on_connect:
        then:
            - component.update: wifi_channel_sensor
    on_disconnect:
        then:
            - lambda: |-
                id(_wifi_disconnects_since_boot)++;

mdns:

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:

dashboard_import:
  package_import_url: github://esphome/example-configs/esphome-web/esp32c6.yaml@main
  import_full_config: true
  
# Status LED on Seeed XIAO ESP32-C6 (GPIO15, yellow USER LED)
status_led:
    pin:
        number: GPIO15

# External antenna control using ESPHome board aliases (FM8625H RF switch)
# RF_SWITCH_EN (GPIO3) = RF switch power, RF_ANT_SELECT (GPIO14) = antenna selector
output:
    - platform: gpio
      id: rf_switch_enable
      pin: RF_SWITCH_EN

    - platform: gpio
      id: rf_antenna_select
      pin: RF_ANT_SELECT

switch:
    - platform: template
      name: "External Antenna"
      optimistic: true
      restore_mode: ALWAYS_ON
      turn_on_action:
          - output.turn_off: rf_switch_enable    # LOW -> RF switch power ON
          - output.turn_on: rf_antenna_select    # HIGH -> external antenna (U.FL/RF2)
      turn_off_action:
          - output.turn_off: rf_switch_enable    # LOW -> RF switch power ON
          - output.turn_off: rf_antenna_select   # LOW -> internal antenna (PCB/RF1)

text_sensor:
    - platform: wifi_info
      ip_address:
          name: "IP"
          entity_category: diagnostic
      mac_address:
          name: "MAC"
          entity_category: diagnostic
      ssid:
          name: "SSID"
          entity_category: diagnostic
      bssid:
          name: "BSSID"
          entity_category: diagnostic

button:
    - platform: restart
      name: "Restart Device"

globals:
    - id: _wifi_disconnects_since_boot
      type: int
      restore_value: no
      initial_value: '0'

time:
    - platform: sntp
      id: sntp_time
      servers:
          - 0.pool.ntp.org
          - 1.pool.ntp.org

uart:
  id: rs485
  tx_pin: GPIO0
  rx_pin: GPIO2
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus_bus
  uart_id: rs485
  flow_control_pin: GPIO1

modbus_controller:
  - id: calefa
    modbus_id: modbus_bus
    address: 0x1
    update_interval: 10s

sensor:
  # ESP information
  - platform: internal_temperature
    name: "Internal Temp"
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    unit_of_measurement: "h"
    accuracy_decimals: 2
    update_interval: 60s
    filters:
        - lambda: return x / 3600.0;
    entity_category: diagnostic

  - platform: wifi_signal
    id: wifi_signal_dbm
    name: "Wi-Fi RSSI"
    update_interval: 30s
    entity_category: diagnostic

  - platform: template
    name: "Wi-Fi Disconnects (since boot)"
    id: wifi_disconnects_since_boot_sensor
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
        return id(_wifi_disconnects_since_boot);

  - platform: template
    name: "Wi-Fi Channel"
    id: wifi_channel_sensor
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
        wifi_ap_record_t ap_info;
        if (esp_wifi_sta_get_ap_info(&ap_info) == ESP_OK) {
          return (float) ap_info.primary;
        }
        return NAN;
  # ---------------- outdoor (IR 20) ----------------
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Outdoor temperature"
    register_type: read
    address: 20
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [multiply: 0.01]

  # ---------------- hot water (IR 6502-6510, one request) ----------------
  - platform: modbus_controller
    modbus_controller_id: calefa
    id: dhw_state_raw
    name: "Hot water state (raw)"   # 2 = idle, 1 = tapping
    register_type: read
    address: 6502
    register_count: 3               # bridges 6503-6504
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: calefa
    id: dhw_temp
    name: "Hot water temperature"   # T4
    register_type: read
    address: 6505
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [multiply: 0.01]
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "District supply temperature"   # T5
    register_type: read
    address: 6506
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [multiply: 0.01]
  - platform: modbus_controller
    modbus_controller_id: calefa
    id: t6
    name: "Hot water primary return"   # T6: exchanger 01 primary out, before valve 37 (stagnant when valve closed)
    register_type: read
    address: 6507
    register_count: 2               # bridges 6508
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [multiply: 0.01]
  - platform: modbus_controller
    modbus_controller_id: calefa
    id: cold_temp
    name: "Cold water temperature"  # T3
    register_type: read
    address: 6509
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [multiply: 0.01]
  - platform: modbus_controller
    modbus_controller_id: calefa
    id: dhw_flow
    name: "Hot water flow"
    register_type: read
    address: 6510
    value_type: U_WORD
    unit_of_measurement: "L/h"
    device_class: volume_flow_rate
    state_class: measurement
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: calefa
    id: dhw_valve
    name: "Hot water valve"          # PICV 37, 0 when no tap is open
    register_type: read
    address: 6511
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters: [multiply: 0.01]

  # ---------------- heating circuit pressure (IR 7310) ----------------
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Heating circuit pressure"
    register_type: read
    address: 7310
    value_type: U_WORD
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    filters: [multiply: 0.01]

  # ---------------- heating circuit (IR 7701-7706, one request) ----------------
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Heating supply temperature"   # T2
    register_type: read
    address: 7701
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [multiply: 0.01]
  - platform: modbus_controller
    modbus_controller_id: calefa
    id: t1
    name: "Heating primary return"   # T1: exchanger 02 primary out, before valve 22 (stagnant when valve closed)
    register_type: read
    address: 7702
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [multiply: 0.01]
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Heating flow target"
    register_type: read
    address: 7703
    register_count: 3               # bridges 7704-7705
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters: [multiply: 0.01]
  - platform: modbus_controller
    modbus_controller_id: calefa
    id: heat_valve
    name: "Heating valve"
    register_type: read
    address: 7706
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters: [multiply: 0.01]

  # HR 7703 changes together with the slope (HR 7701) when edited on the display.
  # Kept as a read-only diagnostic to check it follows when the slope is written via Modbus.
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Heat curve slope (copy)"
    register_type: holding
    address: 7703
    value_type: U_WORD
    accuracy_decimals: 1
    entity_category: diagnostic
    filters: [multiply: 0.1]

  # ---------------- derived values ----------------
  # District return estimated from the two primary returns, each weighted by its
  # valve opening (both are PICVs, so flow ~ opening). A sensor whose valve is
  # closed reads stagnant water and is ignored. K = max-flow ratio of the hot
  # water valve (37) to the heating valve (22); 1.0 until the valve sizes are known.
  - platform: template
    name: "District return (estimated)"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      const float K = 1.0;
      float wd = (isnan(id(dhw_valve).state) || isnan(id(t6).state)) ? 0 : id(dhw_valve).state * K;
      float wh = (isnan(id(heat_valve).state) || isnan(id(t1).state)) ? 0 : id(heat_valve).state;
      if (wd + wh < 0.5) return NAN;   // both valves closed: no primary flow
      return ((wd > 0 ? wd * id(t6).state : 0) + (wh > 0 ? wh * id(t1).state : 0)) / (wd + wh);
  - platform: template
    name: "Hot water power"
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    # flow [L/h] / 1000 -> m3/h ; × ΔT × 1.163 kWh/(m3·K)
    lambda: |-
      if (isnan(id(dhw_flow).state) || isnan(id(dhw_temp).state) || isnan(id(cold_temp).state)) return NAN;
      float p = id(dhw_flow).state / 1000.0 * (id(dhw_temp).state - id(cold_temp).state) * 1.163;
      return p > 0 ? p : 0;
  #- platform: integration
  #  name: "Hot water volume"
  #  sensor: dhw_flow
  #  time_unit: h
  #  unit_of_measurement: "L"
  #  device_class: water
  #  state_class: total_increasing
  #  accuracy_decimals: 1
  #  restore: true

binary_sensor:
  - platform: template
    name: "Hot water in use"
    device_class: running
    lambda: return id(dhw_state_raw).state == 1;

  # ---------------- alarms (discrete inputs, labels from the Sentio doc) ----------------
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Calefa warning"
    register_type: discrete_input
    address: 1
    device_class: problem
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Calefa error"
    register_type: discrete_input
    address: 2
    device_class: problem
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Hot water temperature too high"
    register_type: discrete_input
    address: 6504
    device_class: problem
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Valve motor failure"
    register_type: discrete_input
    address: 6505
    device_class: problem
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "District supply sensor failure"
    register_type: discrete_input
    address: 6506
    device_class: problem
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Hot water primary return sensor failure"
    register_type: discrete_input
    address: 6507
    device_class: problem
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Hot water sensor failure"
    register_type: discrete_input
    address: 6508
    device_class: problem
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Cold water sensor failure"
    register_type: discrete_input
    address: 6509
    device_class: problem

number:
  # Tested OK
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Room setpoint"
    address: 7501
    value_type: S_WORD
    multiply: 100
    min_value: 15
    max_value: 25
    step: 0.5
    unit_of_measurement: "°C"
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Hot water setpoint"
    address: 6521
    value_type: S_WORD
    multiply: 100
    min_value: 45
    max_value: 60
    step: 1
    unit_of_measurement: "°C"
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Manual heat offset"
    address: 7705
    value_type: S_WORD
    unit_of_measurement: "°C"
    multiply: 100
    min_value: -9
    max_value: 9
    step: 1

  # ---------------- heat curve (HR 7701 / 7706-7707) – not yet write-tested ----------------
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Heat curve slope"
    address: 7701
    value_type: U_WORD
    multiply: 10
    min_value: 0.2
    max_value: 3.0
    step: 0.1
    mode: box
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Heat curve min flow"
    address: 7706
    value_type: S_WORD
    multiply: 100
    min_value: 20
    max_value: 50
    step: 1
    unit_of_measurement: "°C"
    mode: box
  - platform: modbus_controller
    modbus_controller_id: calefa
    name: "Heat curve max flow"
    address: 7707
    value_type: S_WORD
    multiply: 100
    min_value: 30
    max_value: 70
    step: 1
    unit_of_measurement: "°C"
    mode: box

